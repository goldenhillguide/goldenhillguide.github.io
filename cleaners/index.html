<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Golden Hill Cleaning Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5efe6;--tan:#b2957a;--tan-d:#8f7359;--ink:#3d3a36;--muted:#7a736b;--line:#e6dccd;--ok:#4f7a4a;
--serif:"Cormorant Garamond",Georgia,serif;--script:"Allura",cursive;--sans:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:#fff;color:var(--ink);font:500 17px/1.45 var(--sans);padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* header */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{height:54px;display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:0 14px}
.brand{font:600 18px/1 var(--serif);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;flex:1;white-space:nowrap}
.brand span{font:400 24px/1 var(--script);text-transform:none;letter-spacing:0;color:var(--tan);margin-left:3px}
.lang{display:flex;background:var(--cream);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font:700 13px/1 var(--sans);padding:9px 12px;border-radius:99px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.prog{font:700 13px/1 var(--sans);color:var(--tan-d);min-width:40px;text-align:right}
.pbar{height:5px;background:var(--cream)}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:760px;margin:0 auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;padding:8px 6px;border-radius:14px;background:var(--cream);text-decoration:none;color:var(--ink);font:600 11px/1.15 var(--sans);text-align:center}
.nav a b{font-size:24px;line-height:1}
.nav a.on{background:var(--ink);color:#fff}
.nav a.done{box-shadow:inset 0 0 0 2px var(--ok)}

/* codes */
.codes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.code.door{grid-column:1/-1;background:var(--ok)}
.code{background:var(--ink);color:#fff;border-radius:18px;padding:14px;text-align:center}
.code .e{font-size:26px}
.code .n{font:700 30px/1.1 var(--sans);letter-spacing:.08em;margin:4px 0}
.code .t{font-size:13px;opacity:.85;line-height:1.3}

/* sections */
section{padding:22px 0 6px}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.sh .ic{font-size:34px;line-height:1}
.sh h2{margin:0;font:600 30px/1.05 var(--serif)}
.sh small{display:block;font:600 13px/1.2 var(--sans);color:var(--muted);margin-top:3px}

/* chips = what must be there */
.chips{display:grid;gap:8px;margin:0 0 14px}
.chip{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:16px;padding:10px 14px}
.chip .e{font-size:28px;line-height:1;flex:0 0 34px;text-align:center}
.chip .n{font:700 24px/1 var(--sans);flex:0 0 auto;min-width:54px;text-align:center;background:#fff;border-radius:12px;padding:8px 6px}
.chip .t{font-size:15px;line-height:1.3}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}

/* checklist rows */
.rows{display:grid;gap:8px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:16px;padding:12px 14px;cursor:pointer;user-select:none}
.row .e{font-size:30px;flex:0 0 36px;text-align:center}
.row .t{flex:1;font-size:16px;line-height:1.3}
.ck{flex:0 0 44px;height:44px;border-radius:50%;border:3px solid var(--tan);display:grid;place-items:center;font-size:24px;color:transparent;background:#fff}
.is-done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.row.is-done{background:#e6efe3}

/* photos */
.photos{display:grid;gap:16px}
.ph{border-radius:20px;overflow:hidden;background:var(--cream);position:relative}
.ph img{display:block;width:100%;height:auto;cursor:zoom-in}
.ph .cap{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.ph .cap .t{flex:1;font:600 17px/1.3 var(--sans)}
.ph .num{position:absolute;top:12px;left:12px;background:rgba(61,58,54,.85);color:#fff;font:700 14px/1 var(--sans);padding:7px 11px;border-radius:99px}
.ph.is-done{background:#e6efe3}
.ph.is-done img{opacity:.75}

.reset{display:block;margin:30px auto 0;border:2px solid var(--line);background:#fff;color:var(--muted);font:700 14px/1 var(--sans);padding:14px 22px;border-radius:99px;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:14px;margin:24px 0 0}
.foot .s{font:400 34px/1 var(--script);color:var(--tan)}

/* lightbox */
.lb{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.lb.open{display:flex}
.lb .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .cap{color:#fff;font:600 18px/1.35 var(--sans);padding:14px 18px calc(18px + env(safe-area-inset-bottom));text-align:center}
.lb .x,.lb .pv,.lb .nx{position:absolute;border:0;background:rgba(255,255,255,.18);color:#fff;width:52px;height:52px;border-radius:50%;font-size:26px;cursor:pointer}
.lb .x{top:calc(12px + env(safe-area-inset-top));right:12px}
.lb .pv{left:10px;top:45%}.lb .nx{right:10px;top:45%}
.lb .cnt{position:absolute;top:calc(26px + env(safe-area-inset-top));left:18px;color:#fff;font:700 14px/1 var(--sans);opacity:.8}

@media (min-width:700px){.photos{grid-template-columns:1fr 1fr}}
@media print{
  .top,.reset,.lb{display:none!important}
  body{font-size:13px;padding:0}
  section{break-inside:auto;padding-top:14px}
  .sh{break-after:avoid}
  .photos{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .ph{break-inside:avoid;border-radius:12px}
  .ph .cap{padding:6px 8px}.ph .cap .t{font-size:12px}
  .ph .ck{display:none}
  .chip{break-inside:avoid;padding:6px 10px}.chip .e{font-size:20px}.chip .n{font-size:16px;padding:5px}
  .row{break-inside:avoid;padding:6px 10px}.row .e{font-size:20px}.row .ck{width:24px;height:24px;flex-basis:24px;border-width:2px}
  .codes{break-inside:avoid}
  .ph.is-done,.row.is-done{background:var(--cream)}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#top">Golden Hill<span>Cleaning</span></a>
    <div class="lang"><button data-l="en">EN</button><button data-l="es">ES</button></div>
    <div class="prog" id="prog">0%</div>
  </div>
  <div class="pbar"><i id="pfill"></i></div>
  <nav class="nav" id="nav"></nav>
</header>

<main class="wrap" id="top">
  <div class="codes" id="codes" style="scroll-margin-top:140px"></div>
  <div id="areas"></div>
  <button class="reset" id="reset"></button>
  <div class="foot"><div class="s">Thank you</div><span id="footT"></span></div>
</main>

<div class="lb" id="lb">
  <span class="cnt" id="lbCnt"></span>
  <button class="x" id="lbX" aria-label="Close">&#10005;</button>
  <div class="img" id="lbImg"><img alt=""></div>
  <button class="pv" id="lbP" aria-label="Previous">&#8249;</button>
  <button class="nx" id="lbN" aria-label="Next">&#8250;</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>
// ===== EDIT CONTENT HERE =====
// Every text has an English (en) and Spanish (es) version.
const C={blue:'#4a6fa5',gray:'#9b9b9b',beige:'#d8c6a6',taupe:'#b3a290'};
const sw=c=>'<span class="sw" style="background:'+C[c]+'"></span>';

const UI={
 en:{done:'done',reset:'Start a new clean',foot:'Questions? Text Justin.',confirm:'Clear all checkmarks?',
  codeDoor:'Front door keypad',codeCab:'All 4 supply cabinets, then slide the red button down',codeCloset:'Bottom floor closet: toilet paper, paper towels, paint'},
 es:{done:'listo',reset:'Empezar nueva limpieza',foot:'¿Preguntas? Mande mensaje a Justin.',confirm:'¿Borrar todas las marcas?',
  codeDoor:'Teclado de la puerta principal',codeCab:'Los 4 gabinetes, luego deslice el botón rojo hacia abajo',codeCloset:'Clóset planta baja: papel higiénico, toallas de papel, pintura'}
};

// Bathroom standard (3 full baths)
const bath=(color,es,tp)=>[
 {e:'🛁',n:'2 + 2',t:{en:sw(color)+'Bath towels: 2 out, 2 under the sink',es:sw(color)+'Toallas de baño: 2 afuera, 2 debajo del lavabo'}},
 {e:'🖐️',n:'1 + 1',t:{en:sw(color)+'Hand towels: 1 on the holder, 1 under the sink',es:sw(color)+'Toallas de mano: 1 en el soporte, 1 debajo del lavabo'}},
 {e:'🧼',n:'3',t:{en:sw(color)+'Washcloths on the vanity',es:sw(color)+'Toallitas en el lavabo'}},
 tp==='under'
  ?{e:'🧻',n:'1 + 1',t:{en:'Toilet paper: 1 on the holder, 1 extra under the sink (electric toilet)',es:'Papel higiénico: 1 en el soporte, 1 extra debajo del lavabo (inodoro eléctrico)'}}
  :{e:'🧻',n:'1 + 1',t:{en:'Toilet paper: 1 on the holder, 1 extra on top of the toilet',es:'Papel higiénico: 1 en el soporte, 1 extra encima del inodoro'}}
];
const remotes=(list)=>({e:'🎛️',n:String(list.length),t:{
 en:'Remotes: '+list.map(k=>({tv:'TV',fire:'fireplace',blinds:'blinds',fan:'fan'})[k]).join(', '),
 es:'Controles: '+list.map(k=>({tv:'TV',fire:'chimenea',blinds:'persianas',fan:'ventilador'})[k]).join(', ')}});

const AREAS=[
 {id:'start',e:'🚪',name:{en:'Start',es:'Inicio'},rows:[
  {e:'📷',t:{en:'Walk the house. Photo any damage or left items and text Justin',es:'Revise la casa. Tome foto de daños u objetos olvidados y mande a Justin'}},
  {e:'🧺',t:{en:'Start the towels in the washer (3rd floor)',es:'Ponga las toallas en la lavadora (3er piso)'}},
  {e:'🧹',t:{en:'Vacuum + Swiffer: 2nd floor closet by the stairs',es:'Aspiradora + Swiffer: clóset del 2º piso junto a la escalera'}}
 ]},
 {id:'kitchen',e:'🍳',name:{en:'Kitchen',es:'Cocina'},chips:[
  {e:'🧻',n:'1 + 1',t:{en:'Paper towels: 1 on the holder, 1 under the sink',es:'Toallas de papel: 1 en el soporte, 1 debajo del fregadero'}},
  {e:'☕',n:'8',t:{en:'Keurig pods in the rack on the Keurig',es:'Cápsulas Keurig en el soporte de la Keurig'}},
  {e:'✨',n:'0',t:{en:'Nothing left on counters except what is in the photos',es:'Nada en las encimeras, solo lo de las fotos'}}
 ],photos:[
  ['kitchen-island',{en:'Island: clean and clear, stools in',es:'Isla: limpia y despejada, bancos adentro'}],
  ['kitchen-counter',{en:'Counter: knife block, trivet, guide sign only',es:'Encimera: solo cuchillos, salvamanteles y letrero'}],
  ['keurig',{en:'8 pods in the Keurig rack',es:'8 cápsulas en el soporte de la Keurig'}],
  ['paper-towel',{en:'1 paper towel roll on the holder',es:'1 rollo de toallas de papel en el soporte'}],
  ['kitchen-sink',{en:'Under the sink: 1 paper towel roll + supplies',es:'Debajo del fregadero: 1 rollo + productos'}]
 ]},
 {id:'living',e:'🛋️',name:{en:'Living Room',es:'Sala'},chips:[
  remotes(['tv','fire','blinds']),
  {e:'🛋️',n:'✓',t:{en:'Cushions and pillows like the photo',es:'Cojines y almohadas como en la foto'}}
 ],photos:[
  ['living',{en:'Living room: finished',es:'Sala: terminada'}],
  ['living-remotes',{en:'3 remotes on the corner: TV, fireplace, blinds',es:'3 controles en la esquina: TV, chimenea, persianas'}]
 ]},
 {id:'primary',e:'👑',name:{en:'Primary Bedroom',es:'Recámara Principal'},color:'blue',chips:[
  {e:'🛏️',n:'✓',t:{en:sw('blue')+'Blue sheets and pillowcases',es:sw('blue')+'Sábanas y fundas azules'}},
  ...bath('blue','azul','under'),
  remotes(['fan','blinds','fire'])
 ],photos:[
  ['primary-made',{en:'Bed: finished',es:'Cama: terminada'}],
  ['primary-sheet',{en:'Blue fitted sheet',es:'Sábana ajustable azul'}],
  ['primary-shower',{en:'2 blue bath towels on the shower door',es:'2 toallas de baño azules en la puerta de la ducha'}],
  ['primary-vanity',{en:'Vanity: hand towel + 3 washcloths',es:'Lavabo: toalla de mano + 3 toallitas'}],
  ['primary-bath-stock',{en:'Under the RIGHT sink: 2 bath towels, 1 hand towel, 1 toilet paper',es:'Debajo del lavabo DERECHO: 2 toallas de baño, 1 de mano, 1 papel'}]
 ]},
 {id:'bed2',e:'2️⃣',name:{en:'Bedroom 2',es:'Recámara 2'},color:'gray',chips:[
  {e:'🛏️',n:'✓',t:{en:sw('taupe')+'Taupe sheets',es:sw('taupe')+'Sábanas color taupe'}},
  ...bath('gray','gris','under'),
  remotes(['fan'])
 ],photos:[
  ['bed2-made',{en:'Bed: finished',es:'Cama: terminada'}],
  ['bed2-sheet',{en:'Taupe fitted sheet',es:'Sábana ajustable taupe'}],
  ['bed2-vanity',{en:'Vanity: gray hand towel + 3 washcloths',es:'Lavabo: toalla de mano gris + 3 toallitas'}],
  ['bed2-tub',{en:'Tub: bath mat over the edge',es:'Tina: tapete sobre el borde'}],
  ['bed2-bath-stock',{en:'Under the sink: 2 gray bath towels, 1 hand towel, 1 toilet paper',es:'Debajo del lavabo: 2 toallas de baño grises, 1 de mano, 1 papel'}]
 ]},
 {id:'bed3',e:'3️⃣',name:{en:'Bedroom 3',es:'Recámara 3'},sub:{en:'Bottom floor',es:'Planta baja'},color:'beige',chips:[
  {e:'🛏️',n:'✓',t:{en:sw('beige')+'Beige sheets',es:sw('beige')+'Sábanas beige'}},
  ...bath('beige','beige','top'),
  remotes(['fan','blinds'])
 ],photos:[
  ['bed3-made',{en:'Bed: finished, green blanket at the foot',es:'Cama: terminada, manta verde a los pies'}],
  ['bed3-sheet',{en:'Beige fitted sheet',es:'Sábana ajustable beige'}],
  ['bed3-bath',{en:'2 beige bath towels on the bar, mat on the tub',es:'2 toallas de baño beige en la barra, tapete en la tina'}],
  ['bed3-vanity',{en:'Vanity + 1 extra toilet paper on top of the toilet',es:'Lavabo + 1 papel extra encima del inodoro'}]
 ]},
 {id:'half',e:'🚽',name:{en:'Half Bath',es:'Medio Baño'},sub:{en:'Marble powder room',es:'Baño de mármol'},chips:[
  {e:'🖐️',n:'1',t:{en:sw('blue')+'Blue hand towel on the ring',es:sw('blue')+'Toalla de mano azul en el aro'}},
  {e:'🧻',n:'1 + 1',t:{en:'Toilet paper: 1 on the holder, 1 extra on top of the toilet',es:'Papel higiénico: 1 en el soporte, 1 extra encima del inodoro'}}
 ],photos:[
  ['powder',{en:'Blue hand towel on the ring',es:'Toalla de mano azul en el aro'}],
  ['powder-tp',{en:'1 extra toilet paper on top of the toilet',es:'1 papel extra encima del inodoro'}],
  ['tp-fold',{en:'Every bathroom: fold the end to a point',es:'Todos los baños: doble la punta del papel'}]
 ]},
 {id:'supplies',e:'🔒',name:{en:'Supplies',es:'Suministros'},photos:[
  ['lock',{en:'Lock: 000, then slide the red button down',es:'Candado: 000, luego deslice el botón rojo'}],
  ['cab-kitchen',{en:'Kitchen cabinets: cleaners, refills, Keurig pods',es:'Gabinetes de cocina: limpiadores, repuestos, cápsulas'}],
  ['cab-towels',{en:'Primary suite top cabinet: towels',es:'Gabinete de arriba (recámara principal): toallas'}],
  ['cab-linens',{en:'Primary suite bottom cabinet: sheets. Top = primary (blue) + detergent, middle = bedroom 2, bottom = bedroom 3',es:'Gabinete de abajo: sábanas. Arriba = principal (azul) + detergente, medio = recámara 2, abajo = recámara 3'}],
  ['closet-iron',{en:'Iron and ironing board',es:'Plancha y burro de planchar'}]
 ]},
 {id:'finish',e:'✅',name:{en:'Finish',es:'Terminar'},rows:[
  {e:'🧺',t:{en:'Fold sheets and towels, put back in the primary suite cabinets',es:'Doble sábanas y toallas, guárdelas en los gabinetes de la recámara principal'}},
  {e:'🫧',t:{en:'Leave the washer door a little open',es:'Deje la puerta de la lavadora un poco abierta'}},
  {e:'🗑️',t:{en:'All trash to the garage bins. Tuesday night: bins to the curb',es:'Toda la basura a los botes del garaje. Martes en la noche: botes a la calle'}},
  {e:'❄️',t:{en:'A/C: 76',es:'Aire acondicionado: 76'}},
  {e:'💡',t:{en:'Lights, TV, and fireplaces off',es:'Apague luces, TV y chimeneas'}},
  {e:'🪟',t:{en:'Windows and garage closed',es:'Ventanas y garaje cerrados'}},
  {e:'🔐',t:{en:'Lock the front door: press ✓ on the keypad',es:'Cierre la puerta: presione ✓ en el teclado'}},
  {e:'📷',t:{en:'Text Justin a photo of every room',es:'Mande a Justin una foto de cada cuarto'}}
 ],photos:[
  ['trash-bins',{en:'Tuesday night: exit the garage, turn right, bins at the curb',es:'Martes en la noche: salga del garaje, a la derecha, botes en la calle'}]
 ]}
];
// ===== END CONTENT =====

let lang='en';try{lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('gh-lang')||'en'}catch(e){}
if(!UI[lang])lang='en';
let store={};try{store=JSON.parse(localStorage.getItem('gh-clean3')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('gh-clean3',JSON.stringify(store))}catch(e){}};
const src=p=>'img/'+p+'.jpg';
const keys=[];AREAS.forEach(a=>{(a.rows||[]).forEach((r,i)=>keys.push(a.id+'-r'+i));(a.photos||[]).forEach((p,i)=>keys.push(a.id+'-p'+i))});

function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 const u=UI[lang];
 document.getElementById('codes').innerHTML=
  '<div class="code door"><div class="e">🏠</div><div class="n">1237</div><div class="t">'+u.codeDoor+'</div></div>'+
  '<div class="code"><div class="e">🔒</div><div class="n">000</div><div class="t">'+u.codeCab+'</div></div>'+
  '<div class="code"><div class="e">🚪</div><div class="n">1237 #</div><div class="t">'+u.codeCloset+'</div></div>';
 document.getElementById('nav').innerHTML='<a href="#codes" data-a="codes"><b>🔑</b>'+(lang==='es'?'Códigos':'Codes')+'</a>'+AREAS.map(a=>'<a href="#'+a.id+'" data-a="'+a.id+'"><b>'+a.e+'</b>'+a.name[lang]+'</a>').join('');
 document.getElementById('areas').innerHTML=AREAS.map(a=>{
  let h='<section id="'+a.id+'"><div class="sh"><span class="ic">'+a.e+'</span><div><h2>'+a.name[lang]+'</h2>'+(a.sub?'<small>'+a.sub[lang]+'</small>':'')+'</div></div>';
  if(a.chips)h+='<div class="chips">'+a.chips.map(c=>'<div class="chip"><span class="e">'+c.e+'</span><span class="n">'+c.n+'</span><span class="t">'+c.t[lang]+'</span></div>').join('')+'</div>';
  if(a.rows)h+='<div class="rows">'+a.rows.map((r,i)=>{const k=a.id+'-r'+i;return '<div class="row'+(store[k]?' is-done':'')+'" data-k="'+k+'"><span class="e">'+r.e+'</span><span class="t">'+r.t[lang]+'</span><span class="ck">✓</span></div>'}).join('')+'</div>';
  if(a.photos)h+='<div class="photos">'+a.photos.map((p,i)=>{const k=a.id+'-p'+i;return '<div class="ph'+(store[k]?' is-done':'')+'" data-k="'+k+'"><span class="num">'+(i+1)+' / '+a.photos.length+'</span><img loading="lazy" src="'+src(p[0])+'" alt="'+p[1][lang].replace(/"/g,'')+'" data-a="'+a.id+'" data-i="'+i+'"><div class="cap"><span class="t">'+p[1][lang]+'</span><span class="ck">✓</span></div></div>'}).join('')+'</div>';
  return h+'</section>';
 }).join('');
 document.getElementById('reset').textContent='↺ '+u.reset;
 document.getElementById('footT').textContent=u.foot;
 progress();
}
function progress(){
 const d=keys.filter(k=>store[k]).length,pct=Math.round(d/keys.length*100);
 document.getElementById('prog').textContent=pct+'%';
 document.getElementById('pfill').style.width=pct+'%';
 AREAS.forEach(a=>{const ks=keys.filter(k=>k.startsWith(a.id+'-'));const el=document.querySelector('.nav a[data-a="'+a.id+'"]');if(el)el.classList.toggle('done',ks.length&&ks.every(k=>store[k]))});
}
document.addEventListener('click',e=>{
 const lb=e.target.closest('.lang button');if(lb){lang=lb.dataset.l;try{localStorage.setItem('gh-lang',lang)}catch(_){}render();return}
 const img=e.target.closest('.ph img');if(img){openLB(img.dataset.a,+img.dataset.i);return}
 const t=e.target.closest('.row,.ph .cap');if(t){const box=t.closest('[data-k]');const k=box.dataset.k;store[k]=!store[k];if(!store[k])delete store[k];save();box.classList.toggle('is-done',!!store[k]);progress();return}
 if(e.target.id==='reset'){if(confirm(UI[lang].confirm)){store={};save();render();scrollTo(0,0)}}
});
// highlight current area in nav
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.a===x.target.id));const on=document.querySelector('.nav a.on');on&&on.scrollIntoView({inline:'center',block:'nearest'})}}),{rootMargin:'-40% 0px -55% 0px'});
const watch=()=>document.querySelectorAll('section').forEach(s=>io.observe(s));

// lightbox
let LA=null,LI=0;const lb=document.getElementById('lb');
function openLB(a,i){LA=AREAS.find(x=>x.id===a);LI=i;showLB();lb.classList.add('open');document.body.style.overflow='hidden'}
function showLB(){const p=LA.photos[LI];lb.querySelector('img').src=src(p[0]);document.getElementById('lbCap').textContent=p[1][lang];document.getElementById('lbCnt').textContent=(LI+1)+' / '+LA.photos.length;
 document.getElementById('lbP').style.visibility=LI>0?'visible':'hidden';document.getElementById('lbN').style.visibility=LI<LA.photos.length-1?'visible':'hidden'}
function closeLB(){lb.classList.remove('open');document.body.style.overflow=''}
document.getElementById('lbX').onclick=closeLB;
document.getElementById('lbP').onclick=()=>{if(LI>0){LI--;showLB()}};
document.getElementById('lbN').onclick=()=>{if(LI<LA.photos.length-1){LI++;showLB()}};
let sx=null;const li=document.getElementById('lbImg');
li.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
li.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(dx<-50)document.getElementById('lbN').click();else if(dx>50)document.getElementById('lbP').click()});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')document.getElementById('lbN').click();if(e.key==='ArrowLeft')document.getElementById('lbP').click()});

const _r=render;render=function(){_r();watch()};
render();
</script>
</body>
</html>
